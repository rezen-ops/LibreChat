# ════════════════════════════════════════════════════════════════════════════
# LibreChat — KMH pilot (iteration 1)
#
# Scope: one client, three agents, cost measured against TypingMind.
# Deliberately NOT here: Redis, Meilisearch, Vertex, multi-client, semantic cache.
#
# NOTE: USE_REDIS is false in the pilot, so edits here take effect on restart.
# The moment Redis arrives in iteration 2, a cache flush MUST go into the deploy
# script or config changes will silently stop applying.
# ════════════════════════════════════════════════════════════════════════════

version: 1.3.1
cache: true

# ── Per-user token budgets ──────────────────────────────────────────────────
# 1000 credits = $0.001. 20M credits ≈ $20/month per person.
# Checked against prompt tokens pre-flight; completion may run a small deficit.
balance:
  # Disabled by decision: cost is tracked and reported, never enforced. Nobody
  # gets cut off mid-sentence. Re-enable only if spend actually becomes a problem.
  enabled: false

# ── Agents ──────────────────────────────────────────────────────────────────
endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    allowedProviders: ['anthropic', 'openAI']
    maxSubagents: 10

    capabilities:
      - file_search      # RAG retrieval — always prefer over file context
      - artifacts
      - skills
      - tools
      - web_search

    # Each citation is billed context. 20/5 is deliberate, not a default.
    maxCitations: 20
    maxCitationsPerFile: 5
    minRelevanceScore: 0.45

    # Durable across restarts. 'memory' loses paused runs on every deploy.
    checkpointer:
      type: mongo

    # Read-only pilot. kmh-data exposes no mutating tools at all, so this is
    # belt-and-braces against a future tool being added carelessly.
    toolApproval:
      deny:
        - 'mcp:klaviyo:*create*'
        - 'mcp:klaviyo:*update*'
        - 'mcp:klaviyo:*delete*'
        - 'mcp:klaviyo:*send*'
      allow:
        - 'mcp:kmh-data:*'
        - 'mcp:klaviyo:*'

    maxToolCallArgBytes: 65536

# ── Skills: the fleet-update mechanism ──────────────────────────────────────
# Agents store skill NAMES, not copies. Edit a SKILL.md in the repo and every
# agent referencing it moves on the next sync. This is the whole reason we left
# TypingMind.
#
# In the pilot, ./skills is also mounted read-only at /app/skill so the bundled
# copies work before the GitHub repo exists. Remove the mount once sync is live.
skillSync:
  github:
    enabled: false          # flip true once kmh-agency/librechat-skills exists
    intervalMinutes: 30
    runOnStartup: true
    sources:
      - id: kmh-skills
        owner: kmh-agency
        repo: librechat-skills
        ref: main
        paths: ['skills']
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'

# ── MCP servers ─────────────────────────────────────────────────────────────
# Configured centrally. Agents reference these by name, so changing an endpoint
# or rotating a key lands for every agent at once.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  maxInputTokens: 8000
  messageWindowSize: 4
  validKeys: ['client_context', 'reporting_preferences', 'working_style']
  agent:
    enabled: true
    provider: 'anthropic'
    model: 'claude-haiku-4-5-20251001'

# ── Web search: three paid vendors stack here. Reranker off by default. ─────
webSearch:
  searchProvider: 'serper'
  serperApiKey: '${SERPER_API_KEY}'
  scraperType: 'firecrawl'
  firecrawlApiKey: '${FIRECRAWL_API_KEY}'
  rerankerType: 'none'

# ── Interface ───────────────────────────────────────────────────────────────
interface:
  modelSelect: true         # free model choice — cost is shown, not capped
  parameters: true
  contextUsage: true
  contextCost: true         # people spend less when they can see the meter
  marketplace:
    use: true
  agents:
    use: true
    create: true
    share: true
    public: false
  skills:
    use: true
    create: false           # skills come from the repo, not the UI
    share: true
  mcpServers:
    use: true
    create: false           # admin-managed only
  remoteAgents:
    # use = can call agents over the API. create = can mint an API key in
    # Settings. Without create, the API Keys panel never appears in the UI.
    use: true
    create: true
  temporaryChatRetention: 720
  retentionMode: 'all'
  retainAgentFiles: true    # purge chats, keep agent knowledge

# ── Model tiers, enforced ───────────────────────────────────────────────────
# Haiku is the default on purpose. Most agency questions are summarise, draft,
# reformat — Sonnet-grade work is the exception, Opus is an explicit decision.
modelSpecs:
  # enforce:false — the tiers are presets people can pick, not a cage.
  enforce: false
  prioritize: true
  list:
    - name: kmh-fast
      label: 'KMH Fast'
      default: true
      description: 'Haiku. Drafting, summarising, reformatting, quick lookups.'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        modelLabel: 'KMH Fast'
        promptCache: true
        maxContextTokens: 100000

    - name: kmh-standard
      label: 'KMH Standard'
      description: 'Sonnet. Analysis, multi-step reporting, anything with judgement.'
      preset:
        endpoint: 'anthropic'
        model: 'claude-sonnet-5'
        modelLabel: 'KMH Standard'
        promptCache: true
        maxContextTokens: 200000

    - name: kmh-deep
      label: 'KMH Deep'
      description: 'Opus. Reserve for genuinely hard analysis — costs several times Standard.'
      preset:
        endpoint: 'anthropic'
        model: 'claude-opus-5'
        modelLabel: 'KMH Deep'
        promptCache: true


# ── Per-client Klaviyo servers ───────────────────────────────────────────────
# GENERATED by `npm run generate` from clients/clients.json.
# Do not hand-edit — re-run the generator. Tokens live in Railway env vars.
