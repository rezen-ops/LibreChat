  klaviyo-8sheep:
    title: '8Sheep'
    description: 'Live Klaviyo data for 8Sheep. Read-only.'
    type: streamable-http
    url: 'https://kmh-klaviyo-mcp-production.up.railway.app/mcp'
    headers:
      Authorization: 'Bearer ${KLAVIYO_TOKEN_8SHEEP}'
    serverInstructions: |
      This connection is locked to 8Sheep. Never pass a brand name —
      the token already selects the account and any brand argument is ignored.
      Read-only: you cannot send, schedule, edit or delete.
      Timeframes are fixed: last_7_days, last_30_days, last_90_days, last_365_days.
